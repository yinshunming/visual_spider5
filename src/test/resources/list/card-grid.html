<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card grid</title>
<style>
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
.card { padding: 1rem; border: 1px solid #ccc; }
</style>
</head>
<body>
<h1>Featured</h1>
<div class="cards">
  <div class="card" id="c1"><span class="text">Card 1 body</span><a class="title" href="/c/1">Card 1 title</a></div>
  <div class="card" id="c2"><span class="text">Card 2 body</span><a class="title" href="/c/2">Card 2 title</a></div>
  <div class="card" id="c3"><span class="text">Card 3 body</span><a class="title" href="/c/3">Card 3 title</a></div>
  <div class="card" id="c4"><span class="text">Card 4 body</span><a class="title" href="/c/4">Card 4 title</a></div>
  <div class="card" id="c5"><span class="text">Card 5 body</span><a class="title" href="/c/5">Card 5 title</a></div>
  <div class="card" id="c6"><span class="text">Card 6 body</span><a class="title" href="/c/6">Card 6 title</a></div>
</div>
</body>
</html>
