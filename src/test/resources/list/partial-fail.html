<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>List with a poisoned item (partial-fail)</title>
</head>
<body>
<h1>Items with one delayed and one poisoned element</h1>
<table>
  <tbody>
    <tr>
      <td><a class="title" href="/items/1">Alpha</a></td>
      <td><span class="date">2024-01-01</span></td>
    </tr>
    <tr>
      <td><a class="title" href="/items/2">Beta</a></td>
      <td><span class="date">2024-01-02</span></td>
    </tr>
    <tr>
      <td><a class="title" href="/items/3">Gamma</a></td>
      <td><span class="date">2024-01-03</span></td>
    </tr>
    <!-- Delta: .date 延迟渲染（8s 后），验证延迟 item 字段缺失只跳过该字段、不破坏主链路 -->
    <tr id="delayed">
      <td><a class="title" href="/items/4">Delta</a></td>
      <td><span class="date"></span></td>
    </tr>
    <!-- Epsilon: .date 含 U+0000（不可入库字段值），PG jsonb 确定性拒绝 -> 真实 sink 行级失败 -> PARTIAL_SUCCESS -->
    <tr id="poison">
      <td><a class="title" href="/items/5">Epsilon</a></td>
      <td><span class="date"></span></td>
    </tr>
  </tbody>
</table>
<script>
  // 同步注入：Epsilon 的 .date 含 NUL（HTML 解析器会把字面控制字符换成 U+FFFD，必须走 DOM API）
  document.querySelector('#poison .date').textContent =
      '2024-01-0' + String.fromCharCode(0) + '5';
  // 延迟渲染：8s 后才补 Delta 的 .date（运行通常在数秒内完成提取，届时该字段缺失）
  setTimeout(function () {
    document.querySelector('#delayed .date').textContent = '2024-01-04';
  }, 8000);
</script>
</body>
</html>
