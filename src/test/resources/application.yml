# Test profile 默认配置：注入合法 seed.admin 凭据，让已有 VisualBrowserIT 等 SpringBootTest
# 能加载 ApplicationContext。生产部署不读这个文件（test classpath 优先）。
#
# 默认（无 it profile）：
#   - Flyway 关闭（避免无 DB 时阻塞 ApplicationContext）
#   - Hikari initialization-fail-timeout=-1 让连接池延迟到第一次获取连接才尝试
#   - 已有 VisualBrowserIT 等不需要 DB 也能加载
#
# @ActiveProfiles("it") 时：application-it.yml 接管，Flyway 启用 + 真实 PG DSN。
seed:
  admin:
    username: test-admin
    raw-password: test-password-12

# 默认跳过 *IT；pg-it profile 显式启用
skipITs: true

# M3-2 (#24) 启动恢复 + 派发器在无 DB 的测试环境关闭，避免阻塞 context 加载
# M6-2: 单实例 guard 同理 -- 仅 it profile + 生产环境启用，常规单测无 PG 关闭
run:
  recovery:
    enabled: false
  dispatcher:
    enabled: false
  single-instance:
    enabled: false

# M6-1：测试默认 classpath 同样豁免回环（VisualBrowserIT 等用 file:/ 或 localhost fixture）；
# 仅豁免 loopback，私有/链路本地/保留/元数据地址仍被拦截。
visualbrowser:
  target-url:
    allow-loopback: true

spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/visualspider_test
    username: visualspider
    password: visualspider
    hikari:
      initialization-fail-timeout: -1
      minimum-idle: 0
      maximum-pool-size: 2
