<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Content-link multi-match fixture (M5-6)</title>
</head>
<body>
<h1>Items (每行含多个链接 -> content-link 多匹配)</h1>
<table>
  <tbody id="rows"></tbody>
</table>
<script>
  (function () {
    // 5 list items；每项含 2 个 <a>（content-page-link 字段选择器 .link 多匹配），
    // 测 readiness MULTIPLE_MATCH（沿用 M4）阻止就绪。
    var rows = document.getElementById('rows');
    for (var i = 1; i <= 5; i++) {
      var d = '0' + i;
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' +
        '  <a class="link" href="/items/' + (i*10) + '">tag ' + i + 'A</a>' +
        '  <a class="link" href="/items/' + (i*10+1) + '">tag ' + i + 'B</a>' +
        '</td>' +
        '<td><span class="date">2024-11-' + d + '</span></td>' +
        '<td class="count">' + (i * 10) + '</td>';
      rows.appendChild(tr);
    }
  })();
</script>
</body>
</html>
