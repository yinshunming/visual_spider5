<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>No-new-items fixture (M5-3)</title>
</head>
<body>
<h1>Items (load more, never adds)</h1>
<table>
  <tbody id="rows"></tbody>
</table>
<button id="more" class="more" type="button">加载更多</button>
<script>
  (function () {
    // 首次 5 项；点击后永远无新增（按钮保留），测 LOAD_MORE 连续 2 次无新增 -> NO_NEW_ITEMS。
    var rows = document.getElementById('rows');
    for (var i = 1; i <= 5; i++) {
      var d = '0' + i;
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td><a class="title" href="/items/' + i + '">Item ' + i + '</a></td>' +
        '<td><span class="date">2024-04-' + d + '</span></td>' +
        '<td class="count">' + (i * 10) + '</td>';
      rows.appendChild(tr);
    }
    // 点击不追加任何 item（no-op handler）
    document.getElementById('more').addEventListener('click', function () { });
  })();
</script>
</body>
</html>
